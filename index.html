<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEED Wiki</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #1d2733; --mute: #5f6b78;
    --line: #dde3ea; --accent: #2e5e8c; --accent-soft: #e8f0f8; --gold: #b07a1f;
    --zebra: #f7f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d; --panel: #1a2129; --ink: #e6ebf0; --mute: #9aa6b2;
      --line: #2d3742; --accent: #8ab8e6; --accent-soft: #223246; --gold: #e0b060;
      --zebra: #1e262f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink);
    font: 16px/1.7 system-ui, "Segoe UI", Roboto, sans-serif;
  }

  /* Top bar */
  header {
    display: flex; gap: .75rem; align-items: center; padding: .75rem 1.25rem;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1.1rem; margin: 0 auto 0 0; letter-spacing: .01em; }

  input, select, button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: .45rem .75rem;
  }
  button { cursor: pointer; }
  button:hover, select:hover, input:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Layout */
  main { display: grid; grid-template-columns: 19rem 1fr; min-height: 0; }

  /* Sidebar */
  nav {
    overflow-y: auto; padding: 1rem; background: var(--panel); border-right: 1px solid var(--line);
  }
  nav input { width: 100%; margin-bottom: .75rem; }
  nav h2 {
    font-size: .72rem; font-weight: 700; color: var(--gold); margin: 1.25rem .5rem .35rem;
    text-transform: uppercase; letter-spacing: .08em;
  }
  nav a {
    display: block; padding: .4rem .6rem; border-radius: 6px; color: var(--ink);
    text-decoration: none; font-size: .95rem; line-height: 1.4;
  }
  nav a:hover { background: var(--bg); }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* Article */
  article { overflow-y: auto; padding: 2rem clamp(1.25rem, 4vw, 3.5rem) 4rem; }
  .doc { max-width: 46rem; margin: 0 auto; }
  .doc h1 {
    font-size: clamp(1.6rem, 2.6vw, 2.1rem); line-height: 1.2; margin: 0 0 .5rem;
    padding-bottom: .6rem; border-bottom: 2px solid var(--line);
  }
  .doc h3 {
    font-size: 1.2rem; margin: 2rem 0 .6rem; padding-left: .7rem;
    border-left: 4px solid var(--accent);
  }
  .doc p { margin: .6rem 0; }
  .doc ul { padding-left: 1.4rem; margin: .6rem 0; }
  .doc li { margin: .3rem 0; }
  .doc img { max-width: 100%; height: auto; border-radius: 8px; margin: .75rem 0; border: 1px solid var(--line); }
  .doc a { color: var(--accent); text-underline-offset: 3px; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }

  .meta {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    color: var(--mute); font-size: .88rem; margin-bottom: 1.5rem;
  }
  .chip {
    background: var(--accent-soft); color: var(--accent); padding: .15rem .6rem;
    border-radius: 999px; font-size: .8rem; font-weight: 600;
  }

  /* Tables */
  .scroll { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { padding: .55rem .8rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  tr:nth-child(even) td { background: var(--zebra); }
  tr:last-child td { border-bottom: 0; }

  /* Collapsible sections */
  details {
    border: 1px solid var(--line); border-radius: 8px; padding: .25rem 1rem .75rem;
    margin: 1rem 0; background: var(--panel);
  }
  summary {
    cursor: pointer; font-weight: 600; padding: .5rem 0; color: var(--accent);
  }

  /* Inline markup */
  mark {
    background: var(--gold); color: #fff; border-radius: 999px; padding: .05em .55em;
    font-size: .78rem; font-weight: 600; vertical-align: middle;
  }
  .err { border-left: 4px solid var(--gold); padding: .25rem 0 .25rem .9rem; }
  pre {
    white-space: pre-wrap; word-break: break-word; background: var(--panel);
    border: 1px solid var(--line); padding: 1rem; border-radius: 8px; font-size: .82rem;
  }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1.2rem; }
  dt { color: var(--mute); font-size: .9rem; }
  dd { margin: 0; }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 14rem 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); }
    article { padding: 1.25rem; }
  }
</style>
</head>
<body>
<header>
  <h1>NEED Wiki</h1>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="kr">Korean</option>
  </select>
  <button id="raw" title="Show the raw data for this article">Raw</button>
</header>
<main>
  <nav>
    <input id="q" type="search" placeholder="Search articles" aria-label="Search articles">
    <div id="list"></div>
  </nav>
  <article>
    <div id="out" class="doc"><p>Loading…</p></div>
  </article>
</main>

<script>
// ---- Configuration -------------------------------------------------------
// Where the wiki data comes from: the data folder next to this file, made by build-static.ps1.
// Relative paths keep everything on the same site, so no proxy is needed. It must end with a slash.
const DATA = "./data/";

// ---- State ---------------------------------------------------------------
let lang = localStorage.getItem("wikiLang") || "en";
let items = [];
let cats = {};
let current = null;
let currentData = null;
let currentUrl = "";
let showRaw = false;

// ---- Helpers -------------------------------------------------------------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const IMG = /\.(png|jpe?g|gif|webp|svg)$/i;

function list(x) {
  if (Array.isArray(x)) return x;
  for (const k of ["articles", "items", "data", "list"]) if (Array.isArray(x?.[k])) return x[k];
  return Object.entries(x || {}).map(([k, v]) => (v && typeof v === "object" ? { id: k, ...v } : { id: k, title: v }));
}
const idOf = (o) => String(o.id ?? o.article_id ?? o.key ?? o.slug ?? o.name ?? "");

function titleOf(o) {
  for (const k of ["title_" + lang, "title", "name", "identifiedDisplayName"]) {
    const v = o?.[k];
    if (typeof v === "string" && v) return v;
    if (v && typeof v === "object") {
      const s = v[lang] ?? v.en ?? v.kr;
      if (typeof s === "string") return s;
    }
  }
  return idOf(o);
}

function catOf(o) {
  const c = o.category ?? o.category_id ?? o.cat ?? o.group;
  if (c == null) return "Other";
  if (typeof c === "object") return titleOf(c);
  return cats[c] || String(c);
}

// Inline markup used in article text: colour codes, links, items, badges.
function fmt(text) {
  let s = esc(text);
  s = s.replace(/\^[0-9a-fA-F]{6}/g, "");                                         // NEED colour codes
  s = s.replace(/\[COLOR:(#[0-9a-fA-F]{3,8}|[a-z]+)\]([\s\S]*?)\[\/COLOR\]/gi, '<span style="color:$1">$2</span>');
  s = s.replace(/\[LINK:([^|\]]+)\|([^\]]*)\]/g, (_, id, label) =>
    `<a href="#${encodeURIComponent(id)}" data-id="${id}">${label}</a>`);
  s = s.replace(/\[ITEM:([^|\]]+)(?:\|([^\]]*))?\]/g, (_, id, label) => `<b>${label || id}</b>`);
  s = s.replace(/\[BADGE:([^\]]*)\]/g, "<mark>$1</mark>");
  return s;
}

function img(src) {
  const url = /^https?:/.test(src) ? src : DATA + (src.startsWith("images/") ? src : "images/" + src);
  return `<img src="${esc(url)}" alt="" loading="lazy">`;
}

function table(head, rows = []) {
  if (!head && rows[0] && !Array.isArray(rows[0])) head = Object.keys(rows[0]);
  const cell = (c) => (c && typeof c === "object" ? block(c) : fmt(c ?? ""));
  const row = (r) => "<tr>" + (Array.isArray(r) ? r : head.map((k) => r[k])).map((c) => `<td>${cell(c)}</td>`).join("") + "</tr>";
  const headRow = head ? "<tr>" + head.map((h) => `<th>${fmt(typeof h === "object" ? titleOf(h) : h)}</th>`).join("") + "</tr>" : "";
  return `<div class="scroll"><table>${headRow}${rows.map(row).join("")}</table></div>`;
}

// Turns one block of article content into HTML. Unknown blocks are shown as raw data, not hidden.
function block(n) {
  if (n == null) return "";
  if (typeof n === "string") return IMG.test(n) && !/\s/.test(n) ? img(n) : `<p>${fmt(n).replace(/\n/g, "<br>")}</p>`;
  if (typeof n !== "object") return `<p>${fmt(n)}</p>`;
  if (Array.isArray(n)) {
    if (n.length > 1 && n.every((r) => r && typeof r === "object" && !Array.isArray(r)) &&
        n.every((r) => Object.keys(r).join() === Object.keys(n[0]).join()) && Object.keys(n[0]).length < 9) {
      return table(null, n);
    }
    return n.map(block).join("");
  }

  const type = String(n.type || n.block || n.kind || "").toLowerCase();
  const text = n.text ?? n.content ?? n.value ?? n.body;
  const kids = n.blocks ?? n.children ?? n.sections;

  if (/^h[1-6]$|heading|title/.test(type)) return `<h3>${fmt(text ?? n.title ?? "")}</h3>`;
  if (/list|^[uo]l$/.test(type)) {
    return "<ul>" + (n.items || n.children || []).map((i) => `<li>${typeof i === "string" ? fmt(i) : block(i)}</li>`).join("") + "</ul>";
  }
  if (type === "table") return table(n.headers || n.columns, n.rows || n.data);
  if (/image|img/.test(type)) {
    return img(String(n.src ?? n.path ?? n.url ?? n.image ?? "")) + (n.caption ? `<div class="meta">${fmt(n.caption)}</div>` : "");
  }
  if (/divider|^hr$/.test(type)) return "<hr>";
  if (/tab/.test(type) && Array.isArray(n.tabs || n.items)) {
    return (n.tabs || n.items).map((t) => `<details open><summary>${fmt(titleOf(t))}</summary>${block(t.blocks ?? t.content ?? t.children)}</details>`).join("");
  }
  if (type && !kids && typeof text !== "string") {
    return `<details><summary>Unsupported block: ${esc(type)}</summary><pre>${esc(JSON.stringify(n, null, 2))}</pre></details>`;
  }
  if (kids || typeof text === "string" || type) {
    return (typeof text === "string" ? block(text) : "") + (kids ? block(kids) : "");
  }
  return "<dl>" + Object.entries(n).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${typeof v === "object" ? block(v) : esc(v)}</dd>`).join("") + "</dl>";
}

// ---- Data loading --------------------------------------------------------
// English first (en/...), then the base file, which is Korean on the NEED server.
const variants = (path) => (lang === "en" ? ["en/" + path, path] : [path]);

async function getJson(path) {
  const res = await fetch(DATA + path);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${path}`);
  return res.json();
}

async function firstThatLoads(paths) {
  for (const p of paths) {
    try { return { data: await getJson(p), path: p }; } catch { /* try the next one */ }
  }
  return null;
}

async function loadIndex() {
  const idx = await firstThatLoads(variants("articles_index.json"));
  if (!idx) throw new Error("Could not load the wiki index. Check the data folder is next to index.html.");
  items = list(idx.data);

  cats = {};
  const cat = await firstThatLoads(variants("categories.json"));
  if (cat) list(cat.data).forEach((c) => (cats[idOf(c)] = titleOf(c)));
  renderNav();
}

// ---- Navigation ----------------------------------------------------------
function renderNav() {
  const q = $("#q").value.trim().toLowerCase();
  const groups = {};
  items
    .filter((o) => (titleOf(o) + " " + idOf(o)).toLowerCase().includes(q))
    .forEach((o) => (groups[catOf(o)] ??= []).push(o));

  let html = `<a href="#@status" data-id="@status" class="${current === "@status" ? "on" : ""}">Server status</a>`;
  for (const [cat, list] of Object.entries(groups)) {
    html += `<h2>${esc(cat)}</h2>`;
    html += list.map((o) => {
      const id = idOf(o);
      return `<a href="#${encodeURIComponent(id)}" data-id="${esc(id)}" class="${id === current ? "on" : ""}">${esc(titleOf(o))}</a>`;
    }).join("");
  }
  $("#list").innerHTML = html;
}

async function openArticle(id) {
  current = id;
  renderNav();
  if (location.hash.slice(1) !== encodeURIComponent(id)) history.replaceState(null, "", "#" + encodeURIComponent(id));
  const out = $("#out");
  out.innerHTML = "<p>Loading…</p>";

  const it = items.find((o) => idOf(o) === id) || { id };
  const candidates = id === "@status"
    ? variants("server_status.json")
    : [it.path, it.file].filter((s) => typeof s === "string").concat(variants(`articles/${id}.json`));

  const hit = await firstThatLoads(candidates);
  if (!hit) {
    out.innerHTML = `<h1>${esc(titleOf(it))}</h1><p class="err">This article could not be loaded.</p>`;
    currentData = null;
    return;
  }

  currentData = hit.data;
  currentUrl = DATA + hit.path;
  render(titleOf(it), catOf(it));
  article_scroll_top();
}

function article_scroll_top() {
  document.querySelector("article").scrollTop = 0;
}

function render(title, meta) {
  const out = $("#out");
  const body = showRaw
    ? `<pre>${esc(JSON.stringify(currentData, null, 2))}</pre>`
    : block(currentData);
  out.innerHTML =
    `<h1>${esc(title)}</h1>` +
    `<div class="meta"><span class="chip">${esc(meta)}</span>` +
    `<a href="${esc(currentUrl)}" target="_blank" rel="noopener">View source</a></div>` +
    body;
}

// ---- Wiring --------------------------------------------------------------
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-id]");
  if (a) {
    e.preventDefault();
    openArticle(a.dataset.id);
  }
});

window.addEventListener("hashchange", () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && id !== current) openArticle(id);
});

$("#q").addEventListener("input", renderNav);

$("#lang").value = lang;
$("#lang").addEventListener("change", async (e) => {
  lang = e.target.value;
  localStorage.setItem("wikiLang", lang);
  try {
    await loadIndex();
    if (current) await openArticle(current);
  } catch (err) {
    $("#out").innerHTML = `<p class="err">${esc(err.message)}</p>`;
  }
});

$("#raw").addEventListener("click", () => {
  showRaw = !showRaw;
  if (currentData) render($("#out h1")?.textContent || "", $("#out .chip")?.textContent || "");
});

(async function start() {
  try {
    await loadIndex();
    const first = decodeURIComponent(location.hash.slice(1)) || (items[0] && idOf(items[0]));
    if (first) await openArticle(first);
    else $("#out").innerHTML = "<p>The wiki index is empty.</p>";
  } catch (err) {
    $("#out").innerHTML = `<p class="err">${esc(err.message)}</p>`;
  }
})();
</script>
</body>
</html>
